<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备配对 · Lab Note</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#243c35;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:28rem;margin:12vh auto;padding:24px}h1{font-size:28px}p{line-height:1.65;color:#52675d}label{display:block;margin:20px 0 6px;font-weight:600}input,button{width:100%;padding:13px;border:1px solid #aebfb3;border-radius:9px;font:inherit}button{background:#2c5b49;color:white;margin-top:24px;border:0}strong{color:#914526}
</style></head><body><main><h1>配对到 Lab Note</h1><p>在运行 Lab Note 的电脑上打开「连接手机 / 平板」页面，查看配对码。配对成功后，这台设备即可查看和编辑同一份记录。</p><!--error--><form method="post" action="/pair"><label for="name">设备名称</label><input id="name" name="name" placeholder="例如：我的 iPad" maxlength="80" required><label for="code">一次性配对码</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" placeholder="8 位数字" required><button type="submit">配对并打开工作台</button></form></main></body></html>
