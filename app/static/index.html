<body>
<aside class="sidebar">
  <a class="brand" href="/"><span class="brand-mark">c<span>·</span></span><span>LAB<br><strong>NOTE</strong></span></a>
  <div class="workspace-tag">个人实验室 / LOCAL</div>
  <nav aria-label="主导航"><button data-view="home" class="nav active"><span>⌂</span> 首页</button><button data-view="work" class="nav"><span>✓</span> 今日工作</button><button data-view="today" class="nav"><span>◉</span> 当前培养</button><button data-view="labs" class="nav"><span>▤</span> 实验记录</button><button data-view="cryo" class="nav"><span>❄</span> 冻存库存</button><button data-view="drugs" class="nav"><span>◫</span> 药物配制 / 存储</button><button data-view="history" class="nav"><span>▦</span> 历史日记</button><button data-view="events" class="nav"><span>≡</span> 操作记录</button><button data-view="backup" class="nav"><span>↓</span> 数据与备份</button></nav>
  <div class="sidebar-bottom"><span class="status-dot"></span> 仅保存在本机<br><small>Lab Note · 本机版</small></div>
</aside>
<main>
  <header class="topbar"><div><span class="eyebrow">LABORATORY NOTEBOOK</span><h1>Lab Note 实验笔记</h1><small class="product-credit">软件作者 <a rel="author noopener" href="https://github.com/LumyQAQ" target="_blank">LumyQAQ</a></small></div><div class="header-utilities"><button type="button" class="button secondary theme-toggle" id="theme-toggle" aria-label="深色模式" aria-pressed="false" title="切换到深色模式">🌙 深色</button><div class="today-date" id="today-date"></div><button type="button" class="button secondary" id="undo-last" disabled>↶ 撤销上一步</button></div></header>
  <div id="connection" class="connection" hidden></div>
  <div id="update-banner" class="update-banner" role="status" hidden></div>
  <div id="content" aria-live="polite"></div>
</main>
<dialog id="cryo-dialog" class="transfer-dialog" aria-label="冻存库存操作"></dialog>
<dialog id="create-dialog"><form id="create-form"><div class="dialog-head"><div><span class="eyebrow">NEW CULTURE</span><h2>添加培养容器</h2></div><button type="button" class="icon-button" id="close-create" aria-label="关闭">×</button></div><label>容器名称<input name="name" required maxlength="120" placeholder="例如：PBMC 第 1 批扩增"></label><div class="two"><label>培养容器<select name="type" id="container-type"></select></label><label>存放位置<input name="location" placeholder="例如：培养箱 1 · 上层"></label></div><label class="group-quantity-field">瓶 / 皿数量<input name="quantity" id="container-quantity" type="number" min="1" max="100" step="1" value="1" required disabled><small class="muted" id="create-quantity-help">孔板按一块记录。</small></label><label class="recipe-picker">基础培养基<select id="create-recipe-base"></select></label><label class="recipe-picker">完全培养基配方<select id="create-recipe"></select><small class="muted">新填写的孔、瓶或皿将带入所选配方。</small></label><details id="create-recipe-details" hidden><summary>查看或修改配方</summary><div id="create-recipe-fields"></div></details><p class="muted">创建后，点击孔位填写细胞和 Day 0。同一块孔板可以记录不同细胞和处理。</p><div class="dialog-actions"><button type="button" class="button secondary" id="cancel-create">取消</button><button class="button primary" type="submit">创建容器</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
