name: Verify Windows preview download
on: workflow_dispatch
permissions:
  contents: read
jobs:
  signed-package-smoke:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - name: Verify the published x64 ZIP and exercise its real CMD entry points
        shell: pwsh
        env:
          ASSET: Lab-Note-1.2.1-preview.1-Windows-x64.zip
          VERSION: v1.2.1-preview.1
          EXPECTED_SHA256: 272917be081217ce423f40b8d9e5b1855b5bbd265415ef9add3d8f2ed971733c
        run: |
          $ErrorActionPreference = 'Stop'
          $assetUrl = "https://github.com/LumyQAQ/Lab-Note/releases/download/$env:VERSION/$env:ASSET"
          $zip = Join-Path $env:RUNNER_TEMP $env:ASSET
          Invoke-WebRequest -Uri $assetUrl -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $env:EXPECTED_SHA256) { throw 'Release checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'Lab Note 测试'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Set-Location (Join-Path $dir 'Lab-Note')
          & .\Start-Lab-Note.cmd -h
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI help failed' }
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 8875)
          try {
            $listener.Start()
            & .\Check-Lab-Note.cmd ci
            if ($LASTEXITCODE -ne 0) { throw 'Windows self-check failed' }
          } finally {
            $listener.Stop()
          }
