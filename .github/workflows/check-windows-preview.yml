name: Verify Windows preview download
on:
  workflow_dispatch:
    inputs:
      source_preflight:
        description: Build and test this ref before publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  signed-package-smoke:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        if: inputs.source_preflight
        with:
          persist-credentials: false
      - name: Build Windows archive from the selected ref
        if: inputs.source_preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip' -OutFile $runtime
          python packaging/build_windows_local.py $runtime $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
      - name: Verify the published x64 ZIP and exercise its real CMD entry points
        shell: pwsh
        env:
          PREFLIGHT: ${{ inputs.source_preflight }}
          ASSET: Lab-Note-1.7.0-preview.1-Windows-x64.zip
          VERSION: v1.7.0-preview.1
          EXPECTED_SHA256: 9a84f902989b75e24b483fc771e2c7eaf20007a86089fd6a9d0fc982be33b057
        run: |
          $ErrorActionPreference = 'Stop'
          $assetUrl = "https://github.com/LumyQAQ/Lab-Note/releases/download/$env:VERSION/$env:ASSET"
          $zip = Join-Path $env:RUNNER_TEMP $env:ASSET
          if ($env:PREFLIGHT -ne 'true') {
            Invoke-WebRequest -Uri $assetUrl -OutFile $zip
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $env:EXPECTED_SHA256) { throw 'Release checksum mismatch' }
          }
          $dir = Join-Path $env:RUNNER_TEMP 'Lab Note 测试'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Set-Location (Join-Path $dir 'Lab-Note')
          function Test-PythonScript([string] $script) {
            $lines = & .\runtime\python.exe -X utf8 -B $script -v 2>&1
            $code = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host "$_" }
            if ($code -ne 0) {
              $detail = (($lines | Select-Object -Last 24) -join ' | ')
              Write-Output "::error title=${script}::$detail"
              throw "$script failed"
            }
          }
          Test-PythonScript 'tests/test_mobile_tls.py'
          Test-PythonScript 'tests/test_mobile_access.py'
          & .\Start-Lab-Note.cmd -h
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI help failed' }
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 8875)
          try {
            $listener.Start()
            $lines = & .\Check-Lab-Note.cmd ci 2>&1
            $code = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host "$_" }
            if ($code -ne 0) {
              $detail = (($lines | Select-Object -Last 20) -join ' | ')
              Write-Output "::error title=Windows self-check::$detail"
              throw 'Windows self-check failed'
            }
          } finally {
            $listener.Stop()
          }
